services:
  backend:
    build: .
    ports: ["8000:8000"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: [".:/app"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on: [backend]
